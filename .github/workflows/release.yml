name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: make build

  sbom:
    name: SBOMs
    needs: validate
    uses: ./.github/workflows/sbom.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  docker:
    name: Docker image
    needs: sbom
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      security-events: write

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: docker
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true

  attach_sboms:
    name: Attach SBOMs
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: write
    steps:
      - name: Download image SBOMs
        uses: actions/download-artifact@v8
        with:
          name: sbom-docker-${{ github.sha }}

      - name: Download source SBOMs
        uses: actions/download-artifact@v8
        with:
          name: sbom-source-${{ github.sha }}

      - name: Attach SBOMs to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            bom-cyclonedx.json
            bom-spdx.json
            sbom-cyclonedx.json
            sbom-cyclonedx.json.sig
            sbom-spdx.json
            sbom-spdx.json.sig
