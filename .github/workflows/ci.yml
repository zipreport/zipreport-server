name: CI

on:
  push:
    branches:
      - development
      - main
      - master
  pull_request:
    branches:
      - development
      - main
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install pinned browser
        run: go run ./cmd/browser-update

      - name: Run tests
        run: make test-integration
        timeout-minutes: 10

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [ test, lint ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: make build

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  build-docker:
    name: Docker Build (multi-platform)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image (multi-platform)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: zipreport-server:test
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-docker:
    name: Docker E2E (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t zipreport-server:e2e-${{ matrix.arch }} .

      - name: Verify image architecture
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' zipreport-server:e2e-${{ matrix.arch }})
          if [ "$arch" != "${{ matrix.arch }}" ]; then
            echo "Expected ${{ matrix.arch }}, got $arch"
            exit 1
          fi

      - name: Generate API key
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "E2E_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Run container
        run: |
          docker run -d --name zipreport-e2e-${{ matrix.arch }} \
            -p 6543:6543 \
            -e ZIPREPORT_API_KEY="$E2E_API_KEY" \
            zipreport-server:e2e-${{ matrix.arch }}

      - name: Wait for container to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "" http://localhost:6543/ 2>/dev/null; then
              echo "Container ready after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Container failed to start within 30s"
              docker logs zipreport-e2e-${{ matrix.arch }}
              exit 1
            fi
            sleep 1
          done

      - name: E2E render test
        run: |
          HTTP_CODE=$(curl -s -o response.pdf -w "%{http_code}" \
            -X POST http://localhost:6543/v2/render \
            -H "X-Auth-Key: $E2E_API_KEY" \
            -F "report=@test/fixtures/test.zpt" \
            -F "script=test.html" \
            -F "page_size=A4" \
            -F "margins=standard")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Expected 200, got $HTTP_CODE"
            docker logs zipreport-e2e-${{ matrix.arch }}
            exit 1
          fi
          head -c 5 response.pdf | grep -q '%PDF' || (echo "Not a valid PDF"; exit 1)
          echo "E2E Docker test passed"

      - name: E2E wrong key is rejected
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:6543/v2/render \
            -H "X-Auth-Key: $(openssl rand -hex 32)" \
            -F "report=@test/fixtures/test.zpt" \
            -F "script=test.html" \
            -F "page_size=A4" \
            -F "margins=standard")
          if [ "$HTTP_CODE" != "401" ]; then
            echo "Expected 401, got $HTTP_CODE"
            docker logs zipreport-e2e-${{ matrix.arch }}
            exit 1
          fi

      - name: E2E invalid page_size is rejected
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:6543/v2/render \
            -H "X-Auth-Key: $E2E_API_KEY" \
            -F "report=@test/fixtures/test.zpt" \
            -F "script=test.html" \
            -F "page_size=INVALID" \
            -F "margins=standard")
          if [ "$HTTP_CODE" != "400" ]; then
            echo "Expected 400, got $HTTP_CODE"
            docker logs zipreport-e2e-${{ matrix.arch }}
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f zipreport-e2e-${{ matrix.arch }}

  test-dedicated:
    name: Test (dedicated launcher)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install pinned browser
        run: go run ./cmd/browser-update

      - name: Allow the Chrome sandbox (user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render tests in dedicated-launcher mode
        timeout-minutes: 10
        run: |
          # dedicated mode needs every needsNoSandbox() input absent (CI/GITHUB_ACTIONS are unset by env -u below)
          { test -z "$KUBERNETES_SERVICE_HOST" && ! test -e /.dockerenv && ! test -e /.containerenv; } || { echo "not dedicated mode"; exit 1; }
          env -u CI -u GITHUB_ACTIONS go test -v -p 1 -count=1 \
            -run '^(TestE2E_PDFGeometry|TestE2E_JSEventMode|TestRender_EgressBlocksInternal|TestRender_FailsClosedWhenContextBypassesProxy|TestJobIsolation_StorageNotShared|TestJobIsolation_ContextsDisposed|TestRenderJob_BeforeUnloadBusyPageReleasesSlot|TestRenderJob_BrowserCrashLeavesNoProxy|TestEngine_DedicatedDiscardRemovesProfile)$' ./test/...

  test-upstream:
    name: Test (upstream proxy, Squid)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the test image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: zipreport-upstream-tests:local
          cache-from: type=gha,scope=upstream-tests
          cache-to: type=gha,mode=max,scope=upstream-tests

      - name: Upstream proxy tests against a real Squid
        timeout-minutes: 20
        run: make test-upstream UPSTREAM_BUILD=

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs: [ test, test-dedicated, test-upstream, lint, build, govulncheck, build-docker, e2e-docker ]
    if: always()
    steps:
      - name: Verify all jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed."
          exit 1

      - name: Success
        run: echo "All CI jobs passed."
