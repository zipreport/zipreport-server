# Real upstream proxy fixture for the TestSquid_* tests: `make test-upstream` runs them in the "tests" container,
# which sits on the fixture's network (works with rootful and rootless Docker). Test-only credentials and
# certificates (certs/ is generated by the make target); nothing here is for production.
#
# public: 203.0.113.0/24 stands in for the internet (IsPublicAddr accepts it). The origin only answers requests that
#         come from Squid's address, so a 200 from it proves the request went through the upstream.
# intranet: a private network only Squid can reach; Squid's ACLs must refuse it (resolve "upstream" relies on this).
name: zipreport-upstream-test

services:
  squid:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./htpasswd:/etc/squid/htpasswd:ro
    networks:
      public:
        ipv4_address: 203.0.113.2
      intranet:
        ipv4_address: 172.30.99.2
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3128'"]
      interval: 2s
      retries: 30

  origin:
    image: nginx:1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    volumes:
      - ./origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./origin/marker.js:/usr/share/nginx/html/marker.js:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      public:
        ipv4_address: 203.0.113.10
        aliases: [origin.test]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 2s
      retries: 30

  intranet:
    image: nginx:1.31-alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    networks:
      intranet:
        ipv4_address: 172.30.99.10
        aliases: [intranet.test]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 2s
      retries: 30

  tests:
    profiles: [tests]
    image: zipreport-upstream-tests:local # CI builds it with a layer cache; make test-upstream builds it otherwise
    build:
      context: ../..
      dockerfile: Dockerfile.test
    environment:
      ZIPREPORT_TEST_SQUID: "1"
    # a run where every TestSquid_ test skipped (or none ran) must fail, not pass
    command:
      - sh
      - -c
      - |
        go test -v -p 1 -count=1 -timeout=10m -run '^TestSquid_' ./test/ > /tmp/squid.out 2>&1
        rc=$$?
        cat /tmp/squid.out
        if grep -q -- '--- SKIP: TestSquid_' /tmp/squid.out || ! grep -q -- '--- PASS: TestSquid_' /tmp/squid.out; then
          echo "TestSquid_ tests skipped or did not run"
          exit 1
        fi
        exit $$rc
    volumes:
      - ../..:/app:ro # the working tree as-is: test/ is excluded from the build context, and edits need no rebuild
    networks:
      public:
        ipv4_address: 203.0.113.20
    depends_on:
      squid: { condition: service_healthy }
      origin: { condition: service_healthy }
      intranet: { condition: service_healthy }

networks:
  public:
    ipam:
      config:
        - subnet: 203.0.113.0/24
          gateway: 203.0.113.1
  intranet:
    internal: true
    ipam:
      config:
        - subnet: 172.30.99.0/24
