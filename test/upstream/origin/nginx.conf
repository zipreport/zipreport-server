# only Squid may fetch (127.0.0.1 is the healthcheck): a 200 proves the request travelled through the upstream proxy.
# A map + if, not allow/deny: "return" runs before the access phase, so allow/deny would not apply to it.
map $remote_addr $not_squid {
    default     1;
    203.0.113.2 0;
    127.0.0.1   0;
}

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    if ($not_squid) { return 403; }

    location = /health { return 200 "ok\n"; }
    location = /host { default_type text/plain; return 200 "$host"; }
    location = /marker.js { root /usr/share/nginx/html; }
}
